# Builds the app for macOS and Windows on every push.
#
# To publish a release, either:
#   - go to Actions → "Build and release" → "Run workflow" and enter a version
#     like 1.2.0, or
#   - push a tag like v1.2.0.
# The release gets the version as its tag, auto-generated notes, and the zips.

name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.2.0 (creates the tag v1.2.0)
        required: true

permissions:
  contents: read

env:
  # The build only needs Electron for the target platform, which the packager
  # downloads itself.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  prepare:
    name: Test and fetch the logo
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
            release=true
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          else
            version="$(node -p 'require("./package.json").version')"
            release=false
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::\"$version\" isn't a version number like 1.2.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Fetch the latest Apple Music logo
        run: |
          pip install pillow
          python scripts/update_logo.py || echo "::warning::Couldn't fetch the logo, so the build uses the icons in the repository."

      - uses: actions/upload-artifact@v7
        with:
          name: icons
          path: icons/
          if-no-files-found: error

  build:
    name: Build ${{ matrix.download }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # target: what the packager calls it ("win32" is its name for
        # Windows, 64-bit included). download: the name people see.
        include:
          - target: darwin-universal
            download: AppleMusicRPC-Mac
            os: macos-latest
            script: pack:mac
          - target: win32-x64
            download: AppleMusicRPC-Windows-64bit
            os: windows-latest
            script: pack:win64
          - target: win32-arm64
            download: AppleMusicRPC-Windows-ARM
            os: windows-latest
            script: pack:win-arm64
          - target: linux-x64
            download: AppleMusicRPC-Linux-64bit
            os: ubuntu-latest
            script: pack:linux64
          - target: linux-arm64
            download: AppleMusicRPC-Linux-ARM
            os: ubuntu-latest
            script: pack:linux-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Use the freshly fetched logo
        uses: actions/download-artifact@v8
        with:
          name: icons
          path: icons

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # On Linux the script talks to D-Bus, so give it a session bus.
      - name: Check the player script runs on this OS
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            command -v dbus-run-session || { sudo apt-get update -q && sudo apt-get install -y -q dbus; }
            dbus-run-session -- node scripts/check-bridge.js
          else
            node scripts/check-bridge.js
          fi

      - name: Set the app version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm pkg set version="$VERSION"

      - run: npm run ${{ matrix.script }}

      # Without this key macOS silently blocks the app from reading Music.
      - name: Check the app can ask for access to Music
        if: runner.os == 'macOS'
        run: /usr/libexec/PlistBuddy -c 'Print :NSAppleEventsUsageDescription' dist/AppleMusicRPC-darwin-universal/AppleMusicRPC.app/Contents/Info.plist

      # Apple Silicon Macs refuse to run unsigned apps. An ad hoc signature
      # is free; users still have to approve the app once (see the README).
      - name: Sign the app (ad hoc)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/AppleMusicRPC-darwin-universal/AppleMusicRPC.app

      # The Mac zip opens to AppleMusicRPC.app, and the Windows and Linux
      # zips to an AppleMusicRPC folder.
      - name: Zip
        env:
          TARGET: ${{ matrix.target }}
          DOWNLOAD: ${{ matrix.download }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/AppleMusicRPC-$TARGET/AppleMusicRPC.app" "$DOWNLOAD.zip"
            exit
          fi
          mkdir zip
          mv "dist/AppleMusicRPC-$TARGET" zip/AppleMusicRPC
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$DOWNLOAD.zip" ./zip/AppleMusicRPC
            exit
          fi
          # Linux: Electron's sandbox check runs before the app's code and
          # can stop it starting on newer Ubuntu releases, so start the app
          # through a launcher that turns the sandbox off. The app shows no
          # web pages, so it doesn't need it.
          mv zip/AppleMusicRPC/AppleMusicRPC zip/AppleMusicRPC/AppleMusicRPC-bin
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/AppleMusicRPC-bin" --no-sandbox "$@"\n' > zip/AppleMusicRPC/AppleMusicRPC
          chmod +x zip/AppleMusicRPC/AppleMusicRPC
          (cd zip && zip -qry "../$DOWNLOAD.zip" AppleMusicRPC)

      # Install the zip over a copy of itself with the app's own updater, the
      # way the app installs updates, to check that works on this system.
      - name: Check the app can install this as an update
        env:
          DOWNLOAD: ${{ matrix.download }}
        run: node scripts/check-update.js "$DOWNLOAD.zip"

      # Upload the zip as-is. Otherwise GitHub wraps it in another zip, and
      # downloading it from the Actions page gives a zip inside a zip.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.download }}.zip
          archive: false
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: release-notes

      # Use release-notes/v<version>.md when it exists. Otherwise GitHub
      # writes the notes, but only for a new release: on a rerun it would
      # add its notes again below the existing ones.
      - name: Choose the release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          file="release-notes/v$VERSION.md"
          if [ -f "$file" ]; then
            echo "Using $file"
            echo "body_path=$file" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "No $file; keeping the release's current notes"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "No $file; GitHub will write the notes"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      # skip-decompress keeps the app zips as they are; otherwise this step
      # would unpack them because they're zip files.
      - uses: actions/download-artifact@v8
        with:
          pattern: AppleMusicRPC-*
          path: release
          merge-multiple: true
          skip-decompress: true

      - name: Check each download opens straight to the app
        run: |
          for file in release/*.zip; do
            echo "$file contains:"
            unzip -Z1 "$file" | cut -d/ -f1 | sort -u | sed 's/^/  /'
            if unzip -Z1 "$file" | grep -qiE '^[^/]+\.zip$'; then
              echo "::error::$file contains another zip"
              exit 1
            fi
          done

      # Running again for an existing release adds and replaces downloads but
      # never removes any, so remove ones that aren't part of this build (for
      # example after downloads are renamed).
      - name: Remove old downloads
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for name in $(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2> /dev/null); do
            if [ ! -f "release/$name" ]; then
              echo "Removing $name"
              gh release delete-asset "v$VERSION" "$name" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          fail_on_unmatched_files: true
          files: release/*.zip
